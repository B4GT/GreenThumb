<!DOCTYPE html>
<html>
<head>

    <title>Plant Generator</title>

</head>
<body>

<!-- RANDOM PLANT GENERATOR CONTAINER -->
<div class="generator">

    <!-- RANDOM PLANT GENERATOR HEADER -->
    <h2>🌿 Random Plant Generator</h2>

    <!-- PLANT DISPLAY SECTION -->
    <div class="plant-display">

	<!-- PLACEHOLDER IMAGE -->

    </div>

    <!-- PLANT NAME TEXT -->

    <!-- PLANT DESCRIPTION TEXT -->
    <p id="plantDescription">
        Discover a plant perfect for your space!
    </p>

    <!-- RANDOM PLANT GENERATOR BUTTON -->
    <button id="generateBtn">Generate Plant</button>

    <!-- QUICK BUY BUTTON -->
    <button id="productBtn">View Product</button>

</div>

<script src="script4.js"></script>
